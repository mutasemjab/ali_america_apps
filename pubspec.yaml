name: LaEsperanza
description: "La Esperanza"
publish_to: 'none'
version: 3.0.0+16

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # DI
  get_it: ^8.0.2

  # Navigation
  go_router: ^14.3.0

  # Utils
  dartz: ^0.10.1
  uuid: ^4.5.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.1
  path_provider: ^2.1.5

  # UI
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.1.0
  flutter_svg: ^2.0.17
  intl_phone_field: ^3.2.0
  share_plus: ^10.1.3
  flutter_animate: ^4.5.2
  barcode_widget: ^2.0.4
  sms_autofill: ^2.4.0
  file_picker: ^8.1.6

  # Push notifications
  firebase_core: ^4.4.0
  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
flutter:
  uses-material-design: true

  assets:
     - assets/
